[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vyoma-handless"
version = "0.1.0"
description = "Voice-controlled PC assistant powered by local speech, Windows UI Automation, and multimodal AI"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Vyoma Innovations" }
]
dependencies = [
    "PySide6>=6.6",
    "sounddevice>=0.4.6",
    "vosk>=0.3.45",
    "webrtcvad-wheels>=2.0.10",
    "keyring>=24.0",
    "pywinauto>=0.6.8",
    "pywin32>=306",
    "comtypes>=1.4.0",
    "rapidfuzz>=3.0",
    "pyautogui>=0.9.54",
    "mss>=9.0",
    "pynput>=1.7",
    "pydantic>=2.0",
    "google-genai>=1.0",
    "pillow>=10.0",
    "pyaudiowpatch>=0.2.12",
    "httpx>=0.25",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
handless = "handless.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

