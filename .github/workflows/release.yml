name: Release Standalone Windows Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Run Pytest Verification
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest -q

      - name: Fetch Offline Whisper Model
        run: |
          python scripts/fetch_whisper_model.py

      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build Executable and Installer
        run: |
          python scripts/build_release.py

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/VyomaHandless-Setup-*.exe
            dist/VyomaHandless-*.zip
          name: Vyoma Handless ${{ github.ref_name }} (Windows 11 / 10, 64-bit)
          body: |
            ## Vyoma Handless ${{ github.ref_name }}

            Voice control for Windows 11 and 10.

            ### Install
            1. Download **VyomaHandless-Setup-*.exe** below.
            2. Run it. No administrator rights are needed; it installs for your Windows account.
               If Windows SmartScreen appears, choose **More info → Run anyway** (the installer is not code-signed yet).
            3. Handless opens a short setup: microphone check, optional AI keys, start-with-Windows.

            A portable **.zip** is also attached if you prefer not to install.

            ### Shortcuts
            - **Ctrl + Space**: hold and speak a command
            - **Hold Ctrl + Shift**: dictate text at your cursor
            - **Win + Shift + Space**: Screen Lens, ask about anything on screen
            - **Ctrl + Alt + H**: show or hide the sidebar
            - **Ctrl + Shift + Q** or **Esc Esc**: emergency stop

            Offline speech recognition (Whisper Base) is bundled, so voice commands work without an API key.
            Add a free Groq or Gemini key in setup for faster, smarter results.
          draft: false
          prerelease: false
