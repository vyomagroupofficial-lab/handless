name: "🐛 Bug Report"
description: "Report a bug or unexpected behavior in Vyoma Handless"
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible to help us reproduce and resolve it quickly.

  - type: input
    id: os_version
    attributes:
      label: "Windows Version"
      description: "Which version of Windows are you running?"
      placeholder: "e.g. Windows 11 Build 22631 (23H2)"
    validations:
      required: true

  - type: dropdown
    id: stt_engine
    attributes:
      label: "STT Engine in Use"
      options:
        - "Groq Whisper Large v3 (Cloud)"
        - "Sherpa-ONNX Whisper Base (Offline CPU)"
        - "Vosk English (Offline)"
        - "Other / Not Sure"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Description of the Bug"
      description: "A clear and concise description of what happened."
      placeholder: "When I said '...', Handless did '...' instead of '...'"
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: "Steps to Reproduce"
      description: "How can we reproduce this behavior?"
      placeholder: |
        1. Open WhatsApp or Chrome
        2. Press F8 or toggle voice bar
        3. Say '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "Relevant Logs"
      description: "Paste relevant output from `logs/handless.log` or `logs/handless_errors.log` (sanitize any private keys!)."
      render: shell

